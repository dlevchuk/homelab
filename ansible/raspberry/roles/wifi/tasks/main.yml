---
- name: Install common Wi-Fi dependencies
  ansible.builtin.apt:
    name:
      - iw
    state: present
    cache_valid_time: 3600

- name: Setup Wi-Fi (NetworkManager backend)
  ansible.builtin.include_tasks: setup_networkmanager.yml

- name: Deploy wifi-fallback systemd service
  ansible.builtin.template:
    src: "wifi-fallback.service.j2"
    dest: "/etc/systemd/system/wifi-fallback.service"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

- name: Deploy wifi-fallback systemd timer
  ansible.builtin.template:
    src: "wifi-fallback.timer.j2"
    dest: "/etc/systemd/system/wifi-fallback.timer"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart wifi-fallback timer

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start wifi-fallback timer
  ansible.builtin.systemd:
    name: "wifi-fallback.timer"
    enabled: true
    state: started

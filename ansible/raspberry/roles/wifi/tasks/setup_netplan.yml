---
# netplan backend for Pi 5 (Ubuntu / systemd-networkd renderer, no NetworkManager)

- name: Install netplan backend packages
  ansible.builtin.apt:
    name:
      - iw
      - hostapd
      - dnsmasq-base
    state: present
    cache_valid_time: 3600

- name: Mask hostapd service (managed via wifi-fallback script only)
  ansible.builtin.systemd:
    name: hostapd
    masked: true
    daemon_reload: false

- name: Deploy netplan Wi-Fi config
  ansible.builtin.template:
    src: 60-wifi.yaml.j2
    dest: /etc/netplan/60-wifi.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Apply netplan

- name: Deploy hostapd configuration
  ansible.builtin.template:
    src: hostapd.conf.j2
    dest: /etc/hostapd/hostapd.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy dnsmasq AP configuration
  ansible.builtin.template:
    src: dnsmasq-ap.conf.j2
    dest: /etc/dnsmasq-ap.conf
    owner: root
    group: root
    mode: "0644"

- name: Deploy wifi-fallback script (netplan variant)
  ansible.builtin.template:
    src: wifi-fallback-netplan.sh.j2
    dest: /usr/local/bin/wifi-fallback.sh
    owner: root
    group: root
    mode: "0750"
  no_log: true

- name: Deploy wifi-fallback systemd service
  ansible.builtin.template:
    src: wifi-fallback.service.j2
    dest: /etc/systemd/system/wifi-fallback.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

- name: Deploy wifi-fallback systemd timer
  ansible.builtin.template:
    src: wifi-fallback.timer.j2
    dest: /etc/systemd/system/wifi-fallback.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart wifi-fallback timer

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start wifi-fallback timer
  ansible.builtin.systemd:
    name: wifi-fallback.timer
    enabled: true
    state: started

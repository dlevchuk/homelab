---
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart wifi-fallback timer
  ansible.builtin.systemd:
    name: "wifi-fallback.timer"
    state: restarted

- name: Restart wpa_supplicant wlan0
  ansible.builtin.systemd:
    name: "wpa_supplicant@wlan0.service"
    state: restarted
  when: wifi_backend == 'wpa_supplicant'

- name: Apply netplan
  ansible.builtin.command: netplan apply
  changed_when: true
  when: wifi_backend == 'netplan'

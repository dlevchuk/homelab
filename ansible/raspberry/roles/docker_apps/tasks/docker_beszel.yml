---
# https://beszel.dev/guide/getting-started
- name: Ensure Beszel data directory exists
  ansible.builtin.file:
    path: "{{ docker_dir }}/beszel/data"
    state: directory
    owner: "{{ docker_user | default('pi') }}"
    group: "{{ docker_user | default('pi') }}"
    mode: "0755"
  when: enable_beszel | default(false) | bool

- name: Setup Beszel hub
  community.docker.docker_container:
    name: beszel
    image: henrygd/beszel:latest
    volumes:
      - "{{ docker_dir }}/beszel/data:/beszel_data"
    ports:
      - "8090:8090"
    restart_policy: unless-stopped
  when: enable_beszel | default(false) | bool

# Hub moved between hosts: remove the container where it is disabled.
# Data in {{ docker_dir }}/beszel stays on disk (manual cleanup).
- name: Remove Beszel hub where it is disabled
  community.docker.docker_container:
    name: beszel
    state: absent
  when: not (enable_beszel | default(false) | bool)

# Agent needs the public key from the hub UI (Add System dialog).
# Skipped until beszel_agent_key is set.
- name: Setup Beszel agent
  community.docker.docker_container:
    name: beszel-agent
    image: henrygd/beszel-agent:latest
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env:
      LISTEN: "45876"
      KEY: "{{ beszel_agent_key }}"
    restart_policy: unless-stopped
  when:
    - (enable_beszel_agent | default(false) | bool) or (enable_beszel | default(false) | bool)
    - beszel_agent_key | default('') | length > 0

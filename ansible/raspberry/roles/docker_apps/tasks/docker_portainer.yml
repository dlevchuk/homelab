---
# https://docs.portainer.io/admin/environments/add/docker/agent
# Hub (UI) runs where enable_portainer is true, agent where enable_portainer_agent is true.
- name: Ensure Portainer directory exists
  ansible.builtin.file:
    path: "{{ docker_dir }}/portainer"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0755"
  when: enable_portainer | default(true) | bool

- name: Create Portainer admin password file
  ansible.builtin.copy:
    content: "{{ portainer_admin_password }}"
    dest: "{{ docker_dir }}/portainer/admin_password"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: "0600"
  no_log: true
  when: enable_portainer | default(true) | bool

- name: Setup Portainer (hub)
  community.docker.docker_container:
    name: portainer
    image: portainer/portainer-ce:latest
    command:
      - "--no-setup-token"
      - "--admin-password-file=/tmp/portainer_password"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{ docker_dir }}/portainer/portainer_data:/data"
      - "{{ docker_dir }}/portainer/admin_password:/tmp/portainer_password:ro"
    ports:
      - "9000:9000"
    restart_policy: always
  when: enable_portainer | default(true) | bool

- name: Setup Portainer agent
  community.docker.docker_container:
    name: portainer_agent
    image: portainer/agent:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    ports:
      - "9001:9001"
    restart_policy: always
  when: enable_portainer_agent | default(false) | bool

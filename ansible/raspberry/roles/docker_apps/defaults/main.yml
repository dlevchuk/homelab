---
# Default variables for docker_apps role

docker_dir: "/home/pi/docker"
docker_user: "pi"
docker_uid: "1000"
docker_gid: "1000"
timezone: "Europe/Kiev"

homepage_host: "{{ ansible_host }}"
# Override per host group in group_vars/raspberry_pi4.yml / raspberry_pi5.yml
homepage_allowed_hosts: "{{ ansible_host }}:3005"

# Homepage look (override per host group)
# colors: slate gray zinc neutral stone amber yellow lime green emerald teal
#         cyan sky blue indigo violet purple fuchsia pink rose red white
homepage_title: "Raspberry Pi"
homepage_theme: "dark"
homepage_color: slate

# Portainer initial admin credentials (min 12 characters)
# Better: override via ansible-vault / env (PORTAINER_ADMIN_PASSWORD)
portainer_admin_password: "{{ lookup('env', 'PORTAINER_ADMIN_PASSWORD') | default('RaspberryAdmin123!', true) }}"

# Docker engine
enable_docker_install: true

# --- Weekly backup into the shared Syncthing folder ---
enable_docker_backup: true
# Cron checks every day at this time (and once after every boot) and runs the
# backup only when the last successful one is at least docker_backup_due_days old.
# 6 days -> one backup per week without drifting; a missed or interrupted run
# is retried the next day.
docker_backup_hour: "3"
docker_backup_minute: "30"
docker_backup_due_days: 6
# Where archives are written (inside the folder shared by Syncthing)
docker_backup_dest: "{{ docker_dir }}/syncthing/sync/backup_docker/{{ inventory_hostname }}"
# How many archives to keep (weekly -> 3 = ~3 weeks of history)
docker_backup_keep: 3
# Stop all running containers while tar runs (consistent SQLite/DB files)
docker_backup_stop_containers: true
# Paths relative to docker_dir. Whole syncthing/sync is excluded (it holds the archives themselves)
docker_backup_excludes:
  - "syncthing/sync"
  - "duplicati/backups"
  - "portainer/admin_password"

# Telegram alert on failure (same secrets as outage_notify)
docker_backup_bot_token: "{{ lookup('env', 'TELEGRAM_TOKEN') }}"
docker_backup_chat_id: "{{ lookup('env', 'TELEGRAM_TO') }}"
# Optional: Uptime Kuma push URL, pinged on success
docker_backup_ping_url: ""

# --- Restore on a fresh system ---
# Used when docker_dir does not exist (or docker_restore_force=true).
# Put docker_apps_*.tar.gz from the laptop into this dir on the Pi before running Ansible.
enable_docker_restore: true
docker_restore_dir: "/var/tmp/docker-restore"
docker_restore_force: false

# Enabled active services
enable_homepage: true
enable_portainer: true         # Portainer hub (UI)
enable_dozzle: true            # Dozzle hub (UI)
enable_watchtower: true
enable_uptime_kuma: true
enable_syncthing: true
enable_speedtest: true
enable_glances: true

# Optional / disabled services
enable_portainer_agent: false  # Portainer agent only (no UI), port 9001
enable_dozzle_agent: false     # Dozzle agent only (no UI), port 7007
enable_adguard: false
enable_duplicati: false
enable_thunderbird: false
enable_freshrss: false
enable_cronicle: false
enable_homebridge: false
enable_music_assistant: false
enable_home_assistant: false
enable_beszel: false
enable_beszel_agent: false

# Dozzle hub: list of agents as host:port (set per host group)
dozzle_remote_agents: []
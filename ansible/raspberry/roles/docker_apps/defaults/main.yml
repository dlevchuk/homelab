---
# Default variables for docker_apps role

docker_dir: "/home/pi/docker"
docker_user: "pi"
docker_uid: "1000"
docker_gid: "1000"
timezone: "Europe/Kiev"

homepage_host: "{{ ansible_host }}"
# Override per host group in group_vars/raspberry_pi4.yml / raspberry_pi5.yml
homepage_allowed_hosts: "{{ ansible_host }}:3005"

# Homepage look (override per host group)
# colors: slate gray zinc neutral stone amber yellow lime green emerald teal
#         cyan sky blue indigo violet purple fuchsia pink rose red white
homepage_title: "Raspberry Pi"
homepage_theme: dark
homepage_color: slate

# Portainer initial admin credentials (min 12 characters)
# Better: override via ansible-vault / env (PORTAINER_ADMIN_PASSWORD)
portainer_admin_password: "{{ lookup('env', 'PORTAINER_ADMIN_PASSWORD') | default('RaspberryAdmin123!', true) }}"

# Docker engine + weekly docker dir backup
enable_docker_install: true
enable_docker_backup: true

# Enabled active services
enable_homepage: true
enable_portainer: true
enable_dozzle: true            # Dozzle hub (UI)
enable_watchtower: true
enable_uptime_kuma: true
enable_syncthing: true
enable_speedtest: true
enable_glances: true

# Optional / disabled services
enable_dozzle_agent: false     # Dozzle agent only (no UI), port 7007
enable_adguard: false
enable_duplicati: false
enable_thunderbird: false
enable_freshrss: false
enable_cronicle: false
enable_homebridge: false
enable_music_assistant: false
enable_home_assistant: false
enable_beszel: false
enable_beszel_agent: false

# Dozzle hub: list of agents as host:port (set per host group)
dozzle_remote_agents: []

# Beszel agent public key (from hub UI -> Add System). Empty = agent not deployed
beszel_agent_key: ""
---
- name: Install thermal camera dependencies
  ansible.builtin.apt:
    name:
      - ffmpeg
      - python3-spidev
      - python3-gpiozero
      - python3-lgpio
      - sqlite3
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure boot directory is determined
  ansible.builtin.include_role:
    name: common
    tasks_from: boot_dir.yml
  when: boot_dir is not defined

- name: Enable SPI (BME280)
  ansible.builtin.lineinfile:
    path: "{{ boot_dir }}/config.txt"
    regexp: '^#?dtparam=spi='
    line: 'dtparam=spi=on'
  notify: Reboot thermal Pi

- name: Add user to hardware groups
  ansible.builtin.user:
    name: "{{ thermal_user }}"
    groups: spi,gpio,video
    append: true
---
- name: Install thermal camera dependencies
  ansible.builtin.apt:
    name:
      - ffmpeg
      - python3-spidev
      - python3-gpiozero
      - python3-lgpio
      - sqlite3
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check which boot config path exists
  ansible.builtin.stat:
    path: /boot/firmware/config.txt
  register: thermal_firmware_config

- name: Enable SPI (BME280)
  ansible.builtin.lineinfile:
    path: "{{ '/boot/firmware/config.txt' if thermal_firmware_config.stat.exists else '/boot/config.txt' }}"
    regexp: '^#?dtparam=spi='
    line: 'dtparam=spi=on'
  notify: Reboot thermal Pi

- name: Add user to hardware groups
  ansible.builtin.user:
    name: "{{ thermal_user }}"
    groups: spi,gpio,video
    append: true

- name: Deploy thermal scripts
  ansible.builtin.copy:
    src: "{{ thermal_src }}/{{ item }}"
    dest: "{{ thermal_home }}/{{ item }}"
    owner: "{{ thermal_user }}"
    group: "{{ thermal_user }}"
    mode: "0755"
  loop:
    - thermal_web.py
    - supabase_sync.py
  notify: Restart thermal-web

- name: Deploy systemd units
  ansible.builtin.copy:
    src: "{{ thermal_src }}/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - thermal-web.service
    - thermal-sync.service
    - thermal-sync.timer
  notify:
    - Reload systemd
    - Restart thermal-web

- name: Write Supabase env file
  ansible.builtin.copy:
    dest: "{{ thermal_home }}/.supabase.env"
    owner: "{{ thermal_user }}"
    group: "{{ thermal_user }}"
    mode: "0600"
    content: |
      SUPABASE_URL={{ supabase_url }}
      SUPABASE_KEY={{ supabase_key }}
  no_log: true
  when:
    - supabase_url | length > 0
    - supabase_key | length > 0

- name: Apply pending handlers before enabling services
  ansible.builtin.meta: flush_handlers

- name: Enable and start thermal-web
  ansible.builtin.systemd:
    name: thermal-web.service
    enabled: true
    state: started

- name: Enable Supabase sync timer
  ansible.builtin.systemd:
    name: thermal-sync.timer
    enabled: true
    state: started
  when:
    - supabase_url | length > 0
    - supabase_key | length > 0
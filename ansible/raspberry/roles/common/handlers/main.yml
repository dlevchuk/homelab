- name: Reboot Pi
  ansible.builtin.reboot:
    connect_timeout: 20
    reboot_timeout: 600
    post_reboot_delay: 30
    test_command: whoami

- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart watchdog
  ansible.builtin.service:
    name: watchdog
    state: restarted

- name: Check watchdog status
  ansible.builtin.command: systemctl is-active watchdog
  changed_when: false

- name: Reload sysctl
  ansible.builtin.systemd:
    name: systemd-sysctl
    state: restarted

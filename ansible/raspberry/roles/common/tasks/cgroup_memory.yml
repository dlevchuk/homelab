---
# Docker memory stats (docker stats / Homepage / Glances / Beszel) need cgroup memory accounting.
# cmdline.txt is a single line: append the flags only if they are missing.
- name: Check which cmdline.txt path exists
  ansible.builtin.stat:
    path: /boot/firmware/cmdline.txt
  register: rpi_cmdline

- name: Enable cgroup memory accounting in cmdline.txt
  ansible.builtin.lineinfile:
    path: "{{ '/boot/firmware/cmdline.txt' if rpi_cmdline.stat.exists else '/boot/cmdline.txt' }}"
    regexp: '^(?!.*\bcgroup_memory=1\b)(.*?)\s*$'
    line: '\1 cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1'
    backrefs: true
  notify: Reboot Pi
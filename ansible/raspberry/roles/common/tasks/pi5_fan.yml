- name: Configure PWM fan overlay for GPIO pin
  ansible.builtin.lineinfile:
    path: "{{ boot_dir }}/config.txt"
    regexp: '^dtoverlay=pwm-fan'
    line: "dtoverlay=pwm-fan,fan_gpio_{{ pi5_fan_gpio }}"
    insertafter: EOF
  when: pi5_fan_gpio is defined
  notify: Reboot Pi

- name: Configure PWM fan parameters on separate firmware-safe lines
  ansible.builtin.blockinfile:
    path: "{{ boot_dir }}/config.txt"
    marker: "# {mark} ANSIBLE GPIO FAN CURVE"
    insertafter: '^dtoverlay=pwm-fan,'
    block: |
      {% for key, value in pi5_fan_curve.items() %}
      dtparam={{ key }}={{ value }}
      {% endfor %}
  when: pi5_fan_gpio is defined
  notify: Reboot Pi

- name: Build and configure the Pi 5 GPIO18 channel correction
  when: (pi5_fan_gpio | default(-1) | int) == 18
  block:
    - name: Install device tree compiler
      ansible.builtin.apt:
        name: device-tree-compiler
        state: present

    - name: Copy GPIO18 PWM overlay source
      ansible.builtin.copy:
        src: pi5-fan-gpio18.dts
        dest: /usr/local/share/pi5-fan-gpio18.dts
        owner: root
        group: root
        mode: "0644"

    - name: Compile and install GPIO18 PWM overlay when its binary differs
      ansible.builtin.shell: |
        set -eu
        overlay={{ (boot_dir ~ '/overlays/pi5-fan-gpio18.dtbo') | quote }}
        compiled=$(mktemp)
        trap 'rm -f "$compiled"' EXIT
        dtc -@ -I dts -O dtb -o "$compiled" /usr/local/share/pi5-fan-gpio18.dts
        if ! cmp -s "$compiled" "$overlay"; then
          install -m 0644 "$compiled" "$overlay"
          echo installed
        fi
      register: pi5_gpio18_overlay_build
      changed_when: "'installed' in pi5_gpio18_overlay_build.stdout_lines"
      notify: Reboot Pi

    - name: Load GPIO18 channel correction after the PWM fan overlay
      ansible.builtin.lineinfile:
        path: "{{ boot_dir }}/config.txt"
        regexp: '^dtoverlay=pi5-fan-gpio18$'
        insertafter: '^dtoverlay=pwm-fan,'
        line: dtoverlay=pi5-fan-gpio18
      notify: Reboot Pi

- name: Remove the GPIO18 PWM channel correction when using another fan pin
  ansible.builtin.lineinfile:
    path: "{{ boot_dir }}/config.txt"
    regexp: '^dtoverlay=pi5-fan-gpio18$'
    state: absent
  when: (pi5_fan_gpio | default(-1) | int) != 18
  notify: Reboot Pi

- name: Set Pi 5 fan curve in boot config (stock internal connector)
  ansible.builtin.lineinfile:
    path: "{{ boot_dir }}/config.txt"
    regexp: '^dtparam={{ item.key }}='
    line: 'dtparam={{ item.key }}={{ item.value }}'
    insertafter: EOF
  loop: "{{ pi5_fan_curve | dict2items }}"
  when: pi5_fan_gpio is not defined
  notify: Reboot Pi

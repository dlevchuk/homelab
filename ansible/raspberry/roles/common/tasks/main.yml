---
- name: Setup SSH
  ansible.builtin.include_tasks: ssh_setup.yml
  when: enable_ssh_setup | default(true) | bool

- name: Initial baseline setup
  ansible.builtin.include_tasks: initial_setup.yml
  when: enable_initial_setup | default(true) | bool

- name: Setup ping reboot watchdog
  ansible.builtin.include_tasks: ping_reboot_setup.yml
  when: enable_ping_reboot | default(true) | bool

- name: Setup hardware watchdog
  ansible.builtin.include_tasks: watchdog_setup.yml
  when: enable_hardware_watchdog | default(false) | bool

- name: Raspberry Pi host specific tasks
  ansible.builtin.include_tasks: raspberry_specific.yml
  when: "'raspberry' in group_names"

- name: Enable cgroup memory accounting (docker stats)
  ansible.builtin.include_tasks: cgroup_memory.yml
  when: enable_cgroup_memory | default(true) | bool

- name: Pi 5 fan curve
  ansible.builtin.include_tasks: pi5_fan.yml
  when:
    - "'raspberry_pi5' in group_names"
    - pi5_fan_curve is defined
---
- name: Create scripts directory
  ansible.builtin.file:
    path: /home/pi/scripts
    state: directory
    mode: "0755"
    owner: pi
    group: pi

- name: Install Raspberry specific packages
  ansible.builtin.apt:
    name:
      - python3-pip
      - mc
      - nano
      - htop
    state: present
    update_cache: true
    cache_valid_time: 3600

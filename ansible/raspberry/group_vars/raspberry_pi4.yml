---
homepage_allowed_hosts: "raspberrypi.tail72e9f.ts.net:3005"
homepage_title: "Raspberry Pi 4"
homepage_color: slate

enable_uptime_kuma: true

# Dozzle hub lives here, pi5 runs only the agent
enable_dozzle: true
dozzle_remote_agents:
  - "pi5.tail72e9f.ts.net:7007"

# Beszel hub + agent (hub moved here from pi5)
enable_beszel: true
enable_beszel_agent: true

# Wi-Fi: multi-network + fallback AP.
# Pi 4 runs NetworkManager (migrated by hand from dhcpcd + wpa_supplicant)
enable_wifi: true
wifi_backend: "networkmanager"


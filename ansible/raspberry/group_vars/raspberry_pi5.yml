---
homepage_allowed_hosts: "pi5.tail72e9f.ts.net:3005"
homepage_title: "Raspberry Pi 5"
homepage_color: zinc

# Uptime Kuma працює тільки на pi4
enable_uptime_kuma: false

# Portainer hub працює на pi4, тут тільки agent
enable_portainer: false
enable_portainer_agent: true
portainer_hub_url: "http://raspberrypi.tail72e9f.ts.net:9000"

# Dozzle hub працює на pi4, тут тільки agent
enable_dozzle: false
enable_dozzle_agent: true
dozzle_hub_url: "http://raspberrypi.tail72e9f.ts.net:8888"

# Music Assistant працює тільки на pi5
enable_music_assistant: false

# Home Assistant працює тільки на pi5
enable_home_assistant: true

# Beszel hub працює на pi4, тут тільки agent
enable_beszel: false
enable_beszel_agent: true
beszel_hub_url: "http://raspberrypi.tail72e9f.ts.net:8090"

# Крива кулера Pi 5 (температура в мільйонних °C, швидкість 0-255)
pi5_fan_curve:
  fan_temp0: 45000
  fan_temp0_hyst: 5000
  fan_temp0_speed: 75
  fan_temp1: 55000
  fan_temp1_hyst: 5000
  fan_temp1_speed: 125
  fan_temp2: 65000
  fan_temp2_hyst: 5000
  fan_temp2_speed: 175
  fan_temp3: 72000
  fan_temp3_hyst: 5000
  fan_temp3_speed: 250

# Wi-Fi: multi-network + fallback AP, same NetworkManager backend as Pi 4.
# Raspberry Pi OS Trixie uses NetworkManager, including netplan-generated profiles.
enable_wifi: true

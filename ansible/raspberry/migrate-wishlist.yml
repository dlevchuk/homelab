---
# Execute locally BEFORE pushing the host flag changes to CI.
- name: Move wishlist monitoring from Pi 5 to Pi 4
  hosts: raspberry_pi4
  gather_facts: false
  become: true
  vars:
    migration_source: rpi-pi5
    migration_archive: /var/tmp/wishlist-migration.tar.gz
  tasks:
    - name: Confirm source is reachable before changing either host
      ansible.builtin.wait_for_connection:
        timeout: 20
      delegate_to: "{{ migration_source }}"

    - name: Check target datastore
      ansible.builtin.stat:
        path: /home/pi/docker/changedetection
      register: migration_target_data

    - name: Do not overwrite an existing destination installation
      ansible.builtin.assert:
        that: not migration_target_data.stat.exists
        fail_msg: Destination datastore already exists. Inspect it before retrying; do not overwrite a live installation.

    - name: Create private controller staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: wishlist-migration-
        path: /tmp
      delegate_to: localhost
      become: false
      register: migration_local

    - name: Transfer the stopped datastore and activate the destination
      block:
        - name: Disable source publisher timer
          ansible.builtin.systemd_service:
            name: wishlist-price-sync.timer
            state: stopped
            enabled: false
          delegate_to: "{{ migration_source }}"

        - name: Stop source publisher and wait for it to exit
          ansible.builtin.systemd_service:
            name: wishlist-price-sync.service
            state: stopped
          delegate_to: "{{ migration_source }}"

        - name: Stop source container for a consistent archive
          community.docker.docker_container:
            name: changedetection
            state: stopped
          delegate_to: "{{ migration_source }}"

        - name: Create archive with private permissions before writing credentials
          ansible.builtin.file:
            path: "{{ migration_archive }}"
            state: touch
            mode: "0600"
          delegate_to: "{{ migration_source }}"

        - name: Archive application data and private exporter credentials
          ansible.builtin.command:
            argv:
              - tar
              - -czf
              - "{{ migration_archive }}"
              - --transform=s#home/pi/.ssh/known_hosts#home/pi/wishlist-price-sync/migration-known-hosts#
              - -C
              - /
              - home/pi/docker/changedetection
              - home/pi/wishlist-price-sync
              - home/pi/.ssh/wishlist_prices
              - home/pi/.ssh/known_hosts
          delegate_to: "{{ migration_source }}"
          no_log: true

        - name: Protect archive
          ansible.builtin.file:
            path: "{{ migration_archive }}"
            mode: "0600"
          delegate_to: "{{ migration_source }}"

        - name: Fetch opaque archive to private controller staging
          ansible.builtin.fetch:
            src: "{{ migration_archive }}"
            dest: "{{ migration_local.path }}/state.tar.gz"
            flat: true
          delegate_to: "{{ migration_source }}"
          no_log: true

        - name: Restore files with their owners and permissions on Pi 4
          ansible.builtin.unarchive:
            src: "{{ migration_local.path }}/state.tar.gz"
            dest: /
          no_log: true

        - name: Read migrated host keys
          ansible.builtin.slurp:
            src: /home/pi/wishlist-price-sync/migration-known-hosts
          register: migration_known_hosts
          no_log: true

        - name: Merge host keys without replacing existing destination keys
          ansible.builtin.lineinfile:
            path: /home/pi/.ssh/known_hosts
            line: "{{ item }}"
            create: true
            owner: pi
            group: pi
            mode: "0600"
          loop: "{{ (migration_known_hosts.content | b64decode).splitlines() }}"
          when: item | length > 0 and not item.startswith('#')
          no_log: true

        - name: Read restored exporter environment
          ansible.builtin.slurp:
            src: /home/pi/wishlist-price-sync/environment
          register: migration_environment
          no_log: true

        - name: Use the existing API key without printing it
          ansible.builtin.set_fact:
            changedetection_api_key: "{{ ((migration_environment.content | b64decode).splitlines() | select('match', '^CHANGEDETECTION_API_KEY=') | first).split('=', 1)[1] }}"
          no_log: true

        - name: Start the migrated application with the existing Ansible role
          ansible.builtin.import_role:
            name: docker_apps
            tasks_from: docker_changedetection.yml

        - name: Install and enable the destination publisher
          ansible.builtin.import_role:
            name: docker_apps
            tasks_from: wishlist_price_sync.yml

        - name: Verify the migrated API key and datastore
          ansible.builtin.uri:
            url: http://127.0.0.1:5000/api/v1/watch
            headers:
              x-api-key: "{{ changedetection_api_key }}"
          no_log: true

        - name: Retire source container after destination verification
          community.docker.docker_container:
            name: changedetection
            state: absent
            keep_volumes: true
          delegate_to: "{{ migration_source }}"

      rescue:
        - name: Stop destination publisher if migration failed
          ansible.builtin.command:
            argv: [systemctl, stop, wishlist-price-sync.timer, wishlist-price-sync.service]
          failed_when: false
          changed_when: true

        - name: Stop destination container before restoring source
          community.docker.docker_container:
            name: changedetection
            state: stopped
          failed_when: false

        - name: Restart source container after failed migration
          community.docker.docker_container:
            name: changedetection
            state: started
          delegate_to: "{{ migration_source }}"

        - name: Restore source publisher after failed migration
          ansible.builtin.systemd_service:
            name: wishlist-price-sync.timer
            state: started
            enabled: true
          delegate_to: "{{ migration_source }}"

        - name: Report migration rollback
          ansible.builtin.fail:
            msg: Migration failed; source container and timer were restored. Inspect the destination before retrying.

      always:
        - name: Remove temporary archive on source
          ansible.builtin.file:
            path: "{{ migration_archive }}"
            state: absent
          delegate_to: "{{ migration_source }}"
          failed_when: false

        - name: Remove private controller staging
          ansible.builtin.file:
            path: "{{ migration_local.path }}"
            state: absent
          delegate_to: localhost
          become: false

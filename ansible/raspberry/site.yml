---
- name: raspberry fleet
  hosts: raspberry
  gather_facts: false
  strategy: free
  become: true
  roles:
    - role: common
      when: "'raspberry_zero' not in group_names"
    - role: docker_apps
      when: "'raspberry_zero' not in group_names"
    - role: thermal_cam
      when: "'raspberry_zero' in group_names"
    - role: beszel_agent
      when: "'raspberry_zero' in group_names"
    - role: outage_notify
    - role: space_cowboy
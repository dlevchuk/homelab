---
- name: raspberry fleet
  hosts: raspberry
  gather_facts: false
  strategy: free
  become: true
  roles:
    # Off by default, enabled per host group (enable_wifi in group_vars)
    - role: wifi
      when: enable_wifi | default(false) | bool
    - role: common
      when: "'raspberry_zero' not in group_names"
    - role: docker_apps
      when: "'raspberry_zero' not in group_names"
    - role: thermal_cam
      when: "'raspberry_zero' in group_names"
    - role: beszel_agent
      when: "'raspberry_zero' in group_names"
    - role: outage_notify
    - role: space_cowboy

    
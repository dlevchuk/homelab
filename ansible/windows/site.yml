---
- name: configure windows host
  hosts: windows
  gather_facts: false

  roles:
    - role: win11_upgrade
      tags: [win11]
    - role: choco_apps
      tags: [choco]
    - role: autohotkey
      tags: [ahk]

  # Runs after the roles and after the deferred reboot handler,
  # so one broken package does not block the other roles or the reboot
  post_tasks:
    - name: Fail if some Chocolatey packages were not installed
      ansible.builtin.fail:
        msg: "Failed packages: {{ choco_failed_packages | join(', ') }}"
      when: choco_failed_packages | default([]) | length > 0
      tags: [always]
---
# Makes the role work alone (--tags ahk) on a host without Chocolatey
- name: Ensure Chocolatey is installed
  chocolatey.chocolatey.win_chocolatey:
    name: chocolatey
    state: present

- name: Gather Chocolatey facts
  chocolatey.chocolatey.win_chocolatey_facts:

- name: Detect installed AutoHotkey version
  ansible.builtin.set_fact:
    autohotkey_installed: >-
      {{ ansible_chocolatey.packages | selectattr('package', 'equalto', 'autohotkey.install')
         | map(attribute='version') | first | default('') }}

# v2 (or any other version) is replaced automatically, scripts need v1
- name: Remove AutoHotkey of another version
  chocolatey.chocolatey.win_chocolatey:
    name:
      - autohotkey
      - autohotkey.install
    state: absent
  when:
    - autohotkey_installed | length > 0
    - autohotkey_installed != autohotkey_version

- name: Install AutoHotkey v1
  chocolatey.chocolatey.win_chocolatey:
    name: autohotkey.install
    version: "{{ autohotkey_version }}"
    state: present
    pinned: true

- name: Deploy scripts to the common Startup folder
  ansible.windows.win_copy:
    src: "{{ item }}"
    dest: "{{ autohotkey_startup_dir }}\\{{ item }}"
  loop: "{{ autohotkey_scripts }}"

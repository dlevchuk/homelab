---
- name: Remove existing AutoHotkey (v2 leftovers)
  chocolatey.chocolatey.win_chocolatey:
    name:
      - autohotkey
      - autohotkey.install
    state: absent
  when: autohotkey_reinstall | bool

# Pinned to v1: scripts use v1 syntax, the default choco package is v2
- name: Install AutoHotkey v1
  chocolatey.chocolatey.win_chocolatey:
    name: autohotkey.install
    version: "{{ autohotkey_version }}"
    state: present
    pinned: true

- name: Deploy scripts to the common Startup folder
  ansible.windows.win_copy:
    src: "{{ item }}"
    dest: "{{ autohotkey_startup_dir }}\\{{ item }}"
  loop: "{{ autohotkey_scripts }}"

- name: Remove scripts that are not selected
  ansible.windows.win_file:
    path: "{{ autohotkey_startup_dir }}\\{{ item }}"
    state: absent
  loop: "{{ autohotkey_all_scripts | difference(autohotkey_scripts) }}"
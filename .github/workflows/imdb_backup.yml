name: IMDB Backup

# DISABLED: IMDb blocks the scraper (lists page cannot be fetched).
# Script moved to scripts/deprecated/backup_imdb_web/. Use manual CSV export instead.
on:
  workflow_dispatch:

permissions:
  contents: write

# One commit-producing backup at a time (goodreads uses the same group)
concurrency:
  group: backup-commit
  cancel-in-progress: false

jobs:
  backup:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      # stdout -> temp file (pure JSON), stderr (progress/logs) -> job log
      - name: Run scraper
        run: |
          python scripts/deprecated/backup_imdb_web/imdb_scraper.py > /tmp/imdb_new.json

      - name: Validate result
        run: |
          python3 - <<'PY'
          import json, sys

          NEW = "/tmp/imdb_new.json"
          OLD = "scripts/deprecated/backup_imdb_web/imdb_backup.json"

          try:
              with open(NEW, encoding="utf-8") as f:
                  new = json.load(f)
          except Exception as e:
              sys.exit(f"ERROR: new backup is not valid JSON: {e}")

          n_lists = new.get("total_lists", 0)
          n_items = new.get("total_items", 0)
          if n_lists == 0 or n_items == 0:
              sys.exit(f"ERROR: empty backup (lists={n_lists}, items={n_items}), keeping the old one")

          try:
              with open(OLD, encoding="utf-8") as f:
                  old_items = json.load(f).get("total_items", 0)
          except Exception:
              old_items = 0

          if old_items and n_items < old_items * 0.5:
              sys.exit(f"ERROR: items dropped {old_items} -> {n_items}, refusing to overwrite")

          print(f"OK: lists={n_lists}, items={n_items} (was {old_items})")
          PY

      - name: Commit and push if changed
        run: |
          cp /tmp/imdb_new.json scripts/deprecated/backup_imdb_web/imdb_backup.json
          echo "File updated, size: $(wc -c < scripts/deprecated/backup_imdb_web/imdb_backup.json) bytes"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/deprecated/backup_imdb_web/imdb_backup.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update IMDB backup - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
name: ansible windows lint

on:
  push:
    paths:
      - ansible/windows/**
      - .github/workflows/ansible_windows_lint.yml
  pull_request:
    paths:
      - ansible/windows/**
      - .github/workflows/ansible_windows_lint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible/windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Ansible and ansible-lint
        run: pip install ansible-core ansible-lint

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      # No connection to a host: only syntax and style
      - name: Syntax check
        run: ansible-playbook site.yml --syntax-check

      - name: Lint
        run: ansible-lint --profile basic site.yml

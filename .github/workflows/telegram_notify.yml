name: send message to telegram
on:
  # Notification only: no checkout, artifacts, or execution of upstream code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - '*'
    types:
      - completed

permissions: {}

jobs:
  notifyTelegram:
    runs-on: ubuntu-latest
    # skip this workflow's own runs, otherwise a failing notify re-triggers itself
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.name != 'send message to telegram' }}
    steps:
    - name: send message
      uses: appleboy/telegram-action@68ac04bda0e0f4755e24649161566b4b6732cc83 # v1.1.2
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ❌ Workflow Failed

          Workflow: ${{ github.event.workflow_run.name }}
          Repository: ${{ github.repository }}
          Branch: ${{ github.event.workflow_run.head_branch }}
          Run: ${{ github.event.workflow_run.html_url }}

  notifyBackupSuccess:
    runs-on: ubuntu-latest
    if: ${{ (github.event.workflow_run.name == 'goodreads backup' || github.event.workflow_run.name == 'IMDB Backup') && github.event.workflow_run.conclusion == 'success' }}
    steps:
    - name: send success message
      uses: appleboy/telegram-action@68ac04bda0e0f4755e24649161566b4b6732cc83 # v1.1.2
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ✅ Backup Successful

          Workflow: ${{ github.event.workflow_run.name }}
          Repository: ${{ github.repository }}
          Branch: ${{ github.event.workflow_run.head_branch }}
          Run: ${{ github.event.workflow_run.html_url }}

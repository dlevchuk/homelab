name: Run Ansible Playbook

on:
  push:
    branches:
      - main
    paths:
      - ansible/raspberry/**
  workflow_dispatch:
    inputs:
      limit:
        description: "Ansible --limit (all, rpi-pi4, rpi-zero, rpi-pi5)"
        required: false
        default: "all"
      check:
        description: "Dry-run (--check --diff), nothing is changed on the hosts"
        type: boolean
        required: false
        default: false

# Serialize fleet changes so two runs cannot reconfigure the same Pi concurrently.
concurrency:
  group: raspberry-deploy
  cancel-in-progress: false

env:
  REMOTE_USER: ${{ secrets.REMOTE_USER }}
  REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
  REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
  THERMAL_REMOTE_HOST: ${{ secrets.THERMAL_REMOTE_HOST }}
  THERMAL_REMOTE_PORT: ${{ secrets.THERMAL_REMOTE_PORT }}
  PI5_REMOTE_HOST: ${{ secrets.PI5_REMOTE_HOST }}
  PI5_REMOTE_PORT: ${{ secrets.PI5_REMOTE_PORT }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
  CHANGEDETECTION_API_KEY: ${{ secrets.CHANGEDETECTION_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
  ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
  WIFI_CONFIG: ${{ secrets.WIFI_CONFIG }}
  ANSIBLE_HOST_KEY_CHECKING: "false"

permissions:
  contents: read
  actions: read

jobs:
  ansible_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select deployment scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_LIMIT: ${{ inputs.limit || 'all' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          limit="$MANUAL_LIMIT"
          tags=""

          if [[ "$EVENT" == push ]]; then
            limit=all
            changed=$(mktemp)
            if git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null &&
               git diff --name-only --no-renames -z "$BEFORE" "$AFTER" -- ansible/raspberry .github/workflows/ansible.yml > "$changed"; then
              pi5_dashboard=false
              thermal_cam=false
              glance=false
              shared=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  ansible/raspberry/roles/pi5_dashboard/*) pi5_dashboard=true ;;
                  ansible/raspberry/roles/thermal_cam/*) thermal_cam=true ;;
                  ansible/raspberry/roles/docker_apps/templates/glance/*) glance=true ;;
                  *) shared=true ;;
                esac
              done < "$changed"

              # Missing or superseded runs can leave changes from an earlier push pending.
              if [[ "$shared" == false ]] && { "$pi5_dashboard" || "$thermal_cam" || "$glance"; }; then
                previous=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ansible.yml/runs" \
                  -f branch=main -f event=push -f status=success -f head_sha="$BEFORE" \
                  --jq '.total_count' 2>/dev/null) || previous=0
                if [[ "$previous" =~ ^[1-9][0-9]*$ ]]; then
                  hosts=()
                  roles=()
                  if "$pi5_dashboard" || "$glance"; then hosts+=(rpi-pi5); fi
                  if "$thermal_cam"; then hosts+=(rpi-zero); roles+=(thermal_cam); fi
                  if "$pi5_dashboard"; then roles+=(pi5_dashboard); fi
                  if "$glance"; then roles+=(glance); fi
                  limit=$(IFS=,; echo "${hosts[*]}")
                  tags=$(IFS=,; echo "${roles[*]}")
                fi
              fi
            fi
            rm -f "$changed"
          fi

          printf 'limit=%s\ntags=%s\n' "$limit" "$tags" >> "$GITHUB_OUTPUT"
          echo "Deploy limit: $limit; tags: ${tags:-all}"

      - name: Connect Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: 'true'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-ansible.posix-community.docker-community.general-v1

      - name: Install Ansible & Requirements
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install ansible.posix community.docker community.general

      - name: Setup SSH & Inventory
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          LIMIT: ${{ steps.scope.outputs.limit }}
          TAGS: ${{ steps.scope.outputs.tags }}
        run: |
          # Remove local config files that might conflict in CI
          rm -f ansible/raspberry/group_vars/all
          rm -f ansible/raspberry/hosts

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ansible
          chmod 600 ~/.ssh/id_ansible

          # public key is used by the common role (authorized_key on every Pi)
          ssh-keygen -y -f ~/.ssh/id_ansible > ~/.ssh/id_ansible.pub
          echo "SSH_PUBLIC_KEY=$(cat ~/.ssh/id_ansible.pub)" >> "$GITHUB_ENV"

          PI4_PORT="${REMOTE_PORT:-7722}"
          ZERO_PORT="${THERMAL_REMOTE_PORT:-22}"
          PI5_PORT="${PI5_REMOTE_PORT:-22}"
          SSH_USER="${REMOTE_USER:-pi}"

          touch ~/.ssh/known_hosts
          if [[ -z "$TAGS" || ",$LIMIT," == *",rpi-pi4,"* ]]; then
            ssh-keyscan -T 5 -p "$PI4_PORT" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          if [[ -z "$TAGS" || ",$LIMIT," == *",rpi-zero,"* ]]; then
            ssh-keyscan -T 5 -p "$ZERO_PORT" -H "$THERMAL_REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          if [[ -z "$TAGS" || ",$LIMIT," == *",rpi-pi5,"* ]]; then
            ssh-keyscan -T 5 -p "$PI5_PORT" -H "$PI5_REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/known_hosts

          # Dynamic inventory: only reachable Pis are added.
          # Groups are always declared (maybe empty), so plays for an offline
          # host are skipped with a warning instead of failing the workflow.
          : > hosts.ini
          add_host() {
            local group="$1" name="$2" host="$3" port="$4"
            echo "[$group]" >> hosts.ini
            if [[ -n "$TAGS" && ",$LIMIT," != *",$name,"* ]]; then
              echo ""
              return
            fi
            if [ -n "$host" ] && nc -z -w 5 "$host" "$port" >/dev/null 2>&1; then
              echo "$name ansible_host=$host ansible_port=$port" >> hosts.ini
              echo "OK: $name ($host:$port) reachable"
            else
              if [[ -n "$TAGS" ]]; then
                echo "::error::$name is unreachable for scoped deployment"
                exit 1
              fi
              echo "::warning::$name ($host:$port) is unreachable, skipping"
            fi
            echo "" >> hosts.ini
          }

          add_host raspberry_pi4   rpi-pi4  "$REMOTE_HOST"         "$PI4_PORT"
          add_host raspberry_zero  rpi-zero "$THERMAL_REMOTE_HOST" "$ZERO_PORT"
          add_host raspberry_pi5   rpi-pi5  "$PI5_REMOTE_HOST"     "$PI5_PORT"

          {
            echo "[raspberry:children]"
            echo "raspberry_pi4"
            echo "raspberry_zero"
            echo "raspberry_pi5"
            echo ""
            echo "[raspberry:vars]"
            echo "ansible_user=${SSH_USER}"
            echo "ansible_python_interpreter=/usr/bin/python3"
          } >> hosts.ini

          echo "--- hosts.ini ---"
          cat hosts.ini

      - name: Run Ansible playbook
        env:
          LIMIT: ${{ steps.scope.outputs.limit }}
          TAGS: ${{ steps.scope.outputs.tags }}
          CHECK_MODE: ${{ inputs.check && 'true' || 'false' }}
          ANSIBLE_PIPELINING: "True"
          ANSIBLE_FORKS: "10"
          ANSIBLE_SSH_ARGS: "-o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ConnectTimeout=15"
          ANSIBLE_CALLBACKS_ENABLED: "ansible.posix.profile_tasks,ansible.posix.timer"
        run: |
          extra=()
          if [ "$CHECK_MODE" = "true" ]; then
            extra+=(--check --diff)
            echo "::notice::Dry-run mode (--check --diff), nothing will be changed"
          fi
          if [[ -n "$TAGS" ]]; then
            extra+=(--tags "$TAGS")
          fi
          ansible-playbook ansible/raspberry/site.yml \
            -i hosts.ini \
            --private-key=~/.ssh/id_ansible \
            --limit "$LIMIT" \
            "${extra[@]}"

      - name: Cleanup SSH Key & Inventory
        if: always()
        run: rm -f ~/.ssh/id_ansible ~/.ssh/id_ansible.pub hosts.ini

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@68ac04bda0e0f4755e24649161566b4b6732cc83 # v1.1.2
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ Workflow Failed

            Workflow: ${{ github.workflow }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

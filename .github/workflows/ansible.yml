name: Run Ansible Playbook

on:
  push:
    branches:
      - main
    paths:
      - ansible/**
  workflow_dispatch:
    inputs:
      limit:
        description: "Ansible --limit (all, rpi-pi4, rpi-zero, rpi-pi5)"
        required: false
        default: "all"

env:
  REMOTE_USER: ${{ secrets.REMOTE_USER }}
  REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
  REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
  THERMAL_REMOTE_HOST: ${{ secrets.THERMAL_REMOTE_HOST }}
  THERMAL_REMOTE_PORT: ${{ secrets.THERMAL_REMOTE_PORT }}
  PI5_REMOTE_HOST: ${{ secrets.PI5_REMOTE_HOST }}
  PI5_REMOTE_PORT: ${{ secrets.PI5_REMOTE_PORT }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
  ANSIBLE_HOST_KEY_CHECKING: "false"

jobs:
  ansible_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: 'true'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Ansible collections
        uses: actions/cache@v5
        with:
          path: ~/.ansible/collections
          key: ansible-collections-ansible.posix-community.docker-v1

      - name: Install Ansible & Requirements
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install ansible.posix community.docker

      - name: Setup SSH & Inventory
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Remove local config files that might conflict in CI
          rm -f ansible/raspberry/group_vars/all
          rm -f ansible/raspberry/hosts

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ansible
          chmod 600 ~/.ssh/id_ansible

          # public key is used by the common role (authorized_key on every Pi)
          ssh-keygen -y -f ~/.ssh/id_ansible > ~/.ssh/id_ansible.pub
          echo "SSH_PUBLIC_KEY=$(cat ~/.ssh/id_ansible.pub)" >> "$GITHUB_ENV"

          PI4_PORT="${REMOTE_PORT:-7722}"
          ZERO_PORT="${THERMAL_REMOTE_PORT:-22}"
          PI5_PORT="${PI5_REMOTE_PORT:-22}"
          SSH_USER="${REMOTE_USER:-pi}"

          touch ~/.ssh/known_hosts
          ssh-keyscan -T 5 -p "$PI4_PORT" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -T 5 -p "$ZERO_PORT" -H "$THERMAL_REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -T 5 -p "$PI5_PORT" -H "$PI5_REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

          # Dynamic inventory: only reachable Pis are added.
          # Groups are always declared (maybe empty), so plays for an offline
          # host are skipped with a warning instead of failing the workflow.
          : > hosts.ini
          add_host() {
            local group="$1" name="$2" host="$3" port="$4"
            echo "[$group]" >> hosts.ini
            if [ -n "$host" ] && nc -z -w 5 "$host" "$port" >/dev/null 2>&1; then
              echo "$name ansible_host=$host ansible_port=$port" >> hosts.ini
              echo "OK: $name ($host:$port) reachable"
            else
              echo "::warning::$name ($host:$port) is unreachable, skipping"
            fi
            echo "" >> hosts.ini
          }

          add_host raspberry_pi4   rpi-pi4  "$REMOTE_HOST"         "$PI4_PORT"
          add_host raspberry_zero  rpi-zero "$THERMAL_REMOTE_HOST" "$ZERO_PORT"
          add_host raspberry_pi5   rpi-pi5  "$PI5_REMOTE_HOST"     "$PI5_PORT"

          {
            echo "[raspberry:children]"
            echo "raspberry_pi4"
            echo "raspberry_zero"
            echo "raspberry_pi5"
            echo ""
            echo "[raspberry:vars]"
            echo "ansible_user=${SSH_USER}"
            echo "ansible_python_interpreter=/usr/bin/python3"
          } >> hosts.ini

          echo "--- hosts.ini ---"
          cat hosts.ini

      - name: Run Ansible playbook
        env:
          LIMIT: ${{ inputs.limit || 'all' }}
          ANSIBLE_PIPELINING: "True"
          ANSIBLE_FORKS: "10"
          ANSIBLE_SSH_ARGS: "-o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ConnectTimeout=15"
          ANSIBLE_CALLBACKS_ENABLED: "ansible.posix.profile_tasks,ansible.posix.timer"
        run: |
          ansible-playbook ansible/raspberry/site.yml \
            -i hosts.ini \
            --private-key=~/.ssh/id_ansible \
            --limit "$LIMIT"

      - name: Cleanup SSH Key & Inventory
        if: always()
        run: rm -f ~/.ssh/id_ansible ~/.ssh/id_ansible.pub hosts.ini
name: Run Ansible Playbook

on:
  push:
    branches:
      - main
    paths:
      - ansible/**
  workflow_dispatch:
    inputs:
      limit:
        description: "Ansible --limit (all, rpi-pi4, rpi-zero, rpi-pi5)"
        required: false
        default: "all"

env:
  REMOTE_USER: ${{ secrets.REMOTE_USER }}
  REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
  REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
  THERMAL_REMOTE_HOST: ${{ secrets.THERMAL_REMOTE_HOST }}
  THERMAL_REMOTE_PORT: ${{ secrets.THERMAL_REMOTE_PORT }}
  PI5_REMOTE_HOST: ${{ secrets.PI5_REMOTE_HOST }}
  PI5_REMOTE_PORT: ${{ secrets.PI5_REMOTE_PORT }}
  ANSIBLE_HOST_KEY_CHECKING: "false"

jobs:
  ansible_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ansible & Requirements
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install ansible.posix community.docker

      - name: Setup SSH & Inventory
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Remove local config files that might conflict in CI
          rm -f ansible/raspberry/group_vars/all
          rm -f ansible/raspberry/hosts

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ansible
          chmod 600 ~/.ssh/id_ansible

          # public key is used by the common role (authorized_key on every Pi)
          ssh-keygen -y -f ~/.ssh/id_ansible > ~/.ssh/id_ansible.pub
          echo "SSH_PUBLIC_KEY=$(cat ~/.ssh/id_ansible.pub)" >> "$GITHUB_ENV"

          PI4_PORT="${REMOTE_PORT:-7722}"
          ZERO_PORT="${THERMAL_REMOTE_PORT:-22}"
          PI5_PORT="${PI5_REMOTE_PORT:-22}"
          SSH_USER="${REMOTE_USER:-pi}"

          touch ~/.ssh/known_hosts
          ssh-keyscan -p "$PI4_PORT" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -p "$ZERO_PORT" -H "$THERMAL_REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -p "$PI5_PORT" -H "$PI5_REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

          # Dynamic inventory: 3 physical Pis
          cat > hosts.ini <<EOF
          [raspberry_pi4]
          rpi-pi4 ansible_host=${REMOTE_HOST} ansible_port=${PI4_PORT}

          [raspberry_zero]
          rpi-zero ansible_host=${THERMAL_REMOTE_HOST} ansible_port=${ZERO_PORT}

          [raspberry_pi5]
          rpi-pi5 ansible_host=${PI5_REMOTE_HOST} ansible_port=${PI5_PORT}

          [raspberry:children]
          raspberry_pi4
          raspberry_zero
          raspberry_pi5

          [raspberry:vars]
          ansible_user=${SSH_USER}
          EOF
          sed -i 's/^[[:space:]]*//' hosts.ini

      - name: Run Ansible playbook
        env:
          LIMIT: ${{ inputs.limit || 'all' }}
          ANSIBLE_SSH_ARGS: "-o ControlMaster=no -o ServerAliveInterval=15"
        run: |
          ansible-playbook ansible/raspberry/site.yml \
            -i hosts.ini \
            --private-key=~/.ssh/id_ansible \
            --limit "$LIMIT"

      - name: Cleanup SSH Key & Inventory
        if: always()
        run: rm -f ~/.ssh/id_ansible ~/.ssh/id_ansible.pub hosts.ini